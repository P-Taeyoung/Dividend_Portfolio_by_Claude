spring.application.name=claude_practice

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3307/dividend_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=dividend_user
spring.datasource.password=dividend1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Static resources - serve React build
spring.web.resources.static-locations=classpath:/static/

server.port=8080
